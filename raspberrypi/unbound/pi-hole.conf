server:
    verbosity: 1
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: no
    prefer-ip6: no

    # High-Performance Multi-Threading on Pi 5 (4-Core Cortex-A76)
    num-threads: 2
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2

    # High-Capacity In-Memory Caching (Leveraging 16GB RAM)
    msg-cache-size: 64m
    rrset-cache-size: 128m
    infra-cache-numhosts: 10000

    # Resiliency: Serve Stale on Upstream Latency / Hiccups
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 200

    # Pre-fetching for 0ms Repeat Queries
    prefetch: yes
    prefetch-key: yes

    # Security & RFC Hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    so-rcvbuf: 4m
    so-sndbuf: 4m

    # Private Subnet Protection
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
